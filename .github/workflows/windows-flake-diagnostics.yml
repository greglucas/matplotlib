---
name: Windows flake diagnostics

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Test scope for this diagnostic run
        type: choice
        options:
          - targeted
          - full
        default: targeted
        required: true
      native_coverage:
        description: Instrument extension modules with MSVC native coverage
        type: boolean
        default: false
        required: true
      workers:
        description: pytest-xdist worker setting
        type: choice
        options:
          - '2'
          - '3'
          - auto
        default: '2'
        required: true

permissions: {}

jobs:
  diagnose:
    if: github.repository == 'greglucas/matplotlib'
    permissions:
      contents: read
    name: "${{ inputs.scope }}, native=${{ inputs.native_coverage }}, n=${{ inputs.workers }}"
    runs-on: windows-2022
    env:
      PYTHONFAULTHANDLER: 1
      PYTHONIOENCODING: UTF-8
      NATIVE_COVERAGE: ${{ inputs.native_coverage }}
      TEST_SCOPE: ${{ inputs.scope }}
      TEST_WORKERS: ${{ inputs.workers }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~\AppData\Local\pip\Cache
          key: windows-diagnostics-py312-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: windows-diagnostics-py312-pip-

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --yes --no-progress

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --group build
          python -m pip install --prefer-binary --group test --group test-extra

      - name: Build Matplotlib with optional native coverage support
        shell: pwsh
        run: |
          python -m pip install --no-build-isolation --verbose --editable '.[dev]' `
            --config-settings=setup-args=--vsenv `
            --config-settings=setup-args=-Dcpp_link_args=-PROFILE `
            --config-settings=setup-args=-Dbuildtype=debug

      - name: Instrument extension modules and start native collector
        if: inputs.native_coverage
        shell: bash
        run: |
          vswhere='/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe'
          vs=$("$vswhere" -latest -products '*' -property installationPath | tr -d '\r')
          tool_dir="$vs/Common7/IDE/Extensions/Microsoft/CodeCoverage.Console"
          tool=$(cygpath -u "$tool_dir/Microsoft.CodeCoverage.Console.exe")
          test -x "$tool"

          session_id=$(python -c "import uuid; print(uuid.uuid4(), end='')")
          echo "VS_COVERAGE_TOOL=$tool" >> "$GITHUB_ENV"
          echo "COVERAGE_SESSION_ID=$session_id" >> "$GITHUB_ENV"
          echo "Coverage tool: $tool"
          echo "Coverage session: $session_id"

          for module in build/cp*/src/*.pyd; do
            echo "Instrumenting $module"
            "$tool" instrument "$module" --session-id "$session_id" \
              --log-level Verbose --log-file instrument.log
          done

          "$tool" collect --session-id "$session_id" --server-mode \
            --output-format cobertura --output extensions.xml \
            --log-level Verbose --log-file extensions.log &

      - name: Run pytest with resource telemetry
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path junit | Out-Null
          $telemetry = Start-Process pwsh -WindowStyle Hidden -PassThru `
            -ArgumentList @('-NoProfile', '-File',
              'tools/ci/windows-resource-telemetry.ps1',
              '-OutputPath', 'windows-telemetry.csv')

          $pytestArgs = @(
            '-m', 'pytest', '-vv', '-rfEsXR', '-n', $env:TEST_WORKERS,
            '--maxfail=50', '--timeout=300', '--durations=100',
            '--junitxml=junit/test-results.xml',
            '--cov-report=xml:coverage.xml', '--cov=lib')
          if ($env:TEST_SCOPE -eq 'targeted') {
            $pytestArgs += @(
              'lib/matplotlib/tests/test_backend_tk.py',
              'lib/matplotlib/tests/test_backend_webagg.py',
              'lib/matplotlib/tests/test_backends_interactive.py',
              'lib/matplotlib/tests/test_font_manager.py',
              'lib/matplotlib/tests/test_getattr.py')
          }

          $pytestExit = 0
          try {
            & python @pytestArgs
            $pytestExit = $LASTEXITCODE
          }
          finally {
            Stop-Process -Id $telemetry.Id -Force -ErrorAction SilentlyContinue
            Wait-Process -Id $telemetry.Id -Timeout 10 -ErrorAction SilentlyContinue
          }
          exit $pytestExit

      - name: Stop native coverage collector
        if: always() && inputs.native_coverage
        shell: bash
        run: |
          if [[ -n $VS_COVERAGE_TOOL && -n $COVERAGE_SESSION_ID ]]; then
            "$VS_COVERAGE_TOOL" shutdown "$COVERAGE_SESSION_ID"
          fi
          for log in extensions.log instrument.log; do
            if [[ -f $log ]]; then
              echo "Native coverage log: $log"
              cat "$log"
            fi
          done

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-diagnostics-${{ inputs.scope }}-native-${{ inputs.native_coverage }}-n-${{ inputs.workers }}
          if-no-files-found: warn
          path: |
            junit/test-results.xml
            coverage.xml
            extensions.xml
            extensions.log
            instrument.log
            windows-telemetry.csv
            .pytest_cache/**

      - name: Upload failed image comparisons
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-diagnostics-result-images
          if-no-files-found: ignore
          path: result_images
