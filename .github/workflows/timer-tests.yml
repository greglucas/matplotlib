---
name: Timer experiments

on:
  push:
    branches:
      - timer-consistency-ci-experiment
  workflow_dispatch:

concurrency:
  group: timer-experiments-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  timers:
    if: github.repository == 'greglucas/matplotlib'
    permissions:
      contents: read
    name: ${{ matrix.os }} Python ${{ matrix.python }} (${{ matrix.policy }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: '3.12'
            policy: default
          - os: macos-15
            python: '3.14'
            policy: default
          - os: macos-15
            python: '3.14'
            policy: latency-critical
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          brew install ninja pkg-config
          python -m pip install --upgrade pip
          python -m pip install --group build --group test
          python -m pip install --only-binary=:all: PyQt5 PyQt6 PySide6
          if [[ "${{ matrix.policy }}" == latency-critical ]]; then
            python -m pip install pyobjc-framework-Cocoa
          fi
          python -m pip install --no-deps --no-build-isolation --editable .

      - name: Run focused timer tests repeatedly
        env:
          MPL_TIMER_LATENCY_CRITICAL: ${{ matrix.policy == 'latency-critical' && '1' || '' }}
          PYTHONFAULTHANDLER: '1'
        run: |
          for run in 1 2 3 4 5; do
            echo "Timer test run ${run}"
            python ci/run_timer_tests.py -rfEsXR -n 2 --timeout=60 \
              lib/matplotlib/tests/test_backends_interactive.py::test_interactive_timers \
              lib/matplotlib/tests/test_backend_webagg.py::test_asyncio_timer_single_shot \
              lib/matplotlib/tests/test_backend_webagg.py::test_asyncio_completed_single_shot_property_update_does_not_restart \
              lib/matplotlib/tests/test_backend_webagg.py::test_tornado_completed_single_shot_property_update_does_not_restart \
              lib/matplotlib/tests/test_backend_webagg.py::test_asyncio_timer_no_drift
          done
